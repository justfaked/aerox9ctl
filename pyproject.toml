[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aerox9ctl"
version = "0.1.0"
description = "Configure the SteelSeries Aerox 9 Wireless on Linux (CLI + Qt GUI), built on rivalcfg"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "rivalcfg>=4.17",
    "hidapi>=0.14",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8"]

[project.scripts]
aerox9ctl = "aerox9ctl.cli:main"

[project.gui-scripts]
aerox9ctl-gui = "aerox9ctl.gui:main"
aerox9ctl-tray = "aerox9ctl.tray:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
